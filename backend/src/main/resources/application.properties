# ---- HTTP ----
quarkus.http.port=8080

# ---- Banco de dados (valores padrão para rodar local; o Docker Compose sobrescreve via variáveis de ambiente) ----
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:root}
quarkus.datasource.password=${DB_PASSWORD:root}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/inventorydb?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}

# Cria/atualiza as tabelas automaticamente (ótimo para demo; em produção real use Flyway/Liquibase)
quarkus.hibernate-orm.database.generation=update

# ---- Documentação da API (Swagger UI em /q/swagger-ui) ----
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Sistema de Controle de Estoque - API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para produtos, matérias-primas e sugestão de produção.

# ---- Dados de demonstração (só são inseridos se o banco estiver vazio) ----
app.seed-demo-data=${SEED_DEMO_DATA:true}
